name: Manutenção autenticada Controle 03
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Conferência ou recuperação delimitada sem email"
        required: true
        default: probe
        type: choice
        options:
          - probe
          - recover
permissions: {}
concurrency:
  group: controle03-maintenance
  cancel-in-progress: false
jobs:
  maintenance:
    runs-on: self-hosted
    timeout-minutes: 8
    steps:
      - name: Conferir integridade e executar procedimento local aprovado
        env:
          RECOVERY_RECEIPTS: /var/lib/controle03-maintenance-48860
          RECOVERY_MODE: ${{ inputs.mode }}
          CONTROLE03_API_USER: ${{ secrets.CONTROLE03_API_USER }}
          CONTROLE03_API_PASS: ${{ secrets.CONTROLE03_API_PASS }}
          CONTROLE03_STATE_URL: ${{ secrets.CONTROLE03_STATE_URL }}
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import hashlib, runpy
          from pathlib import Path
          p = Path('/opt/controle03-maintenance-48860/recuperar_via_runner.py')
          assert hashlib.sha256(p.read_bytes()).hexdigest() == 'dbb94285ddb9045596a781813d89c363c40da78c25065d06269c9f1039815c0c', 'Procedimento local divergente; interrompido'
          runpy.run_path(str(p), run_name='__main__')
          PYTHON
